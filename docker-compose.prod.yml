services:
  # .NET Backend API
  backend:
    build:
      context: ./src
      dockerfile: CloudInvoiceApp.Backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__invoice-db: "Host=${POSTGRES_HOST:-postgres};Port=5432;Database=${POSTGRES_DB:-InvoiceDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: CloudInvoiceApp
      Jwt__Audience: CloudInvoiceApp
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      AllowedOrigins: ${ALLOWED_ORIGINS}
    networks:
      - default
      - shared  
    
  # Build frontend static files into a shared volume
  frontend-build:
    build:
      context: ./src/CloudInvoiceApp.Web
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - frontend-dist:/output
    entrypoint: ["sh", "-c", "cp -r /dist/* /output/"]

  # Nginx — serves frontend + proxies API
  nginx:
    container_name: nginx_invoice
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks:
      - default
      - shared    

volumes:
  postgres-data:
  frontend-dist:

networks:
    shared:
      external: true
      name: shared-net