<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded background -->
  <rect width="64" height="64" fill="#4F46E5" rx="14"/>

  <!-- Document shape (white, slightly transparent) -->
  <path d="M 18 10 L 38 10 L 46 18 L 46 54 Q 46 56 44 56 L 20 56 Q 18 56 18 54 Z" fill="white" opacity="0.25"/>

  <!-- Document fold -->
