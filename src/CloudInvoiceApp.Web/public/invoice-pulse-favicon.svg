    points="14,36 24,36 28,24 32,44 36,30 40,36 50,36"
    fill="none"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle invoice lines -->
  <line x1="24" y1="46" x2="40" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="24" y1="50" x2="34" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>
