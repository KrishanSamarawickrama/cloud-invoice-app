services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-InvoiceDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-InvoiceDb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    image: ${APP_IMAGE:-youruser/cloud-invoice-app:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # PostgreSQL — Aspire component reads from ConnectionStrings__<name>
      ConnectionStrings__invoice-db: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB:-InvoiceDb};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD}
      # JWT
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-CloudInvoiceApp}
      Jwt__Audience: ${JWT_AUDIENCE:-CloudInvoiceApp}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      # Google OAuth (server-side token validation)
      Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      # CORS
      AllowedOrigins: ${ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - shared

volumes:
  postgres-data:

networks:
  internal:
    driver: bridge
  shared:
    external: true
    name: shared-net
